    }

      margin: 2rem auto;
      padding: 0 1rem;

      box-shadow: var(--shadow);
      background: #000;
      margin-bottom: 2rem;

      left: 0;
      width: 100%;
      height: 100%;
      border: 0;

      padding-bottom: 0.4rem;

      align-items: center;

      padding-bottom: 5px;

      cursor: pointer;

      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);

      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;

    .question-title {

    }

    .options-grid {

      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 1rem;
    }

    .option-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 12px 15px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;

      display: flex;
      align-items: center;
      gap: 10px;
    }

      background: #f8fafc;
      border-color: var(--primary);
    }

      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
      font-weight: bold;
    }

      background: var(--incorrect-bg) !important;
      border-color: var(--incorrect) !important;
      color: var(--incorrect) !important;

      margin-top: 1rem;

      font-size: 0.95rem;
      display: none;
    }

    .explanation.show {

    }

      color: var(--correct);

    }

</head>

        textToSpeak: "Être victime de son succès"
      },
      {
        title: "Un livre de chevet",
        english: "A bedside book / Favorite book",
        meaning: "Un livre très cher à quelqu'un, qu'il garde près de son lit et relit souvent.",
        example: "'La Gloire de mon père' de Marcel Pagnol a été le livre de chevet de toute une génération.",
        textToSpeak: "Un livre de chevet"
      }
    ];

    let userAnswers = {};
    let currentScore = 0;

    // Initialisation de la page
    window.onload = () => {
      renderQuiz('all');
      renderExpressions();
    };

    // Rendu du Quiz
    function renderQuiz(filter) {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      const filteredQuestions = filter === 'all' 
        ? questions 
        : questions.filter(q => q.category === filter);

      filteredQuestions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `q-${q.id}`;

        const isAnswered = userAnswers.hasOwnProperty(q.id);
        const selectedOpt = userAnswers[q.id];

        let optionsHTML = '';
        q.options.forEach((opt, oIdx) => {
          let btnClass = 'option-btn';
          if (isAnswered) {
            if (oIdx === q.answer) btnClass += ' correct';
            else if (oIdx === selectedOpt) btnClass += ' incorrect';
          }

          optionsHTML += `
            <button class="${btnClass}" 
                    onclick="selectAnswer(${q.id}, ${oIdx})" 
                    ${isAnswered ? 'disabled' : ''}>
              <span>${String.fromCharCode(65 + oIdx)}.</span> ${opt}
            </button>
          `;
        });

        let explanationHTML = '';
        if (isAnswered) {
          const isCorrect = selectedOpt === q.answer;
          explanationHTML = `
            <div class="explanation show ${isCorrect ? 'correct-exp' : 'incorrect-exp'}">
              <strong>${isCorrect ? 'Correct !' : 'Incorrect.'}</strong> ${q.explanation}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="question-header">
            <span class="question-tag">${q.catLabel}</span>
            <span class="question-title">${q.id}. ${q.question}</span>
          </div>
          <div class="options-grid">
            ${optionsHTML}
          </div>
          ${explanationHTML}
        `;

        container.appendChild(card);
      });
    }

    // Gestion de la sélection d'une réponse
    function selectAnswer(questionId, optionIndex) {
      if (userAnswers.hasOwnProperty(questionId)) return;

      userAnswers[questionId] = optionIndex;

      const q = questions.find(item => item.id === questionId);
      if (optionIndex === q.answer) {
        currentScore++;
      }

      updateScoreDisplay();
      
      // Re-rendre la question actuellement filtrée
      const activeNav = document.querySelector('.quiz-nav button.active');
      const currentFilter = activeNav ? activeNav.getAttribute('onclick').match(/'([^']+)'/)[1] : 'all';
      renderQuiz(currentFilter);
    }

    // Mise à jour du score
    function updateScoreDisplay() {
      document.getElementById('score').innerText = currentScore;
      const msg = document.getElementById('score-msg');
      
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount === 20) {
        if (currentScore >= 18) {
          msg.innerText = "Félicitations ! Excellent niveau en français et parfaite connaissance de Marseille !";
        } else if (currentScore >= 12) {
          msg.innerText = "Très bon travail ! Vous avez de très bonnes bases.";
        } else {
          msg.innerText = "Bonne tentative ! N'hésitez pas à revoir la vidéo pour vous perfectionner.";
        }
      } else {
        msg.innerText = `${answeredCount} / 20 question(s) répondue(s).`;
      }
    }

    // Filtrer le Quiz
    function filterQuiz(category) {
      document.querySelectorAll('.quiz-nav button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderQuiz(category);
    }

    // Rendu des Expressions
    function renderExpressions() {
      const container = document.getElementById('expressions-container');
      container.innerHTML = '';

      expressions.forEach(exp => {
        const card = document.createElement('div');
        card.className = 'expression-card';

        card.innerHTML = `
          <div>
            <div class="expression-header">
              <div class="expression-title">${exp.title}</div>
              <div class="expression-english">${exp.english}</div>
              <button class="audio-btn" onclick="speakText('${exp.textToSpeak.replace(/'/g, "\\'")}')">
                🔊 Écouter
              </button>
            </div>
            <div class="expression-meaning">${exp.meaning}</div>
          </div>
          <div class="expression-example">
            <strong>Exemple :</strong> "${exp.example}"
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Synthèse vocale pour la prononciation
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("La synthèse vocale n'est pas supportée par votre navigateur.");
      }
    }
  </script>
</body>
</html>
